type GeneralLedger {
  id: ID!
  transactionNumber: String!
  transactionDate: String!
  transactionType: String!
  referenceModule: String!
  referenceId: String!
  debitAccount: String!
  creditAccount: String!
  amount: Float!
  currency: String!
  description: String!
  fiscalYear: String!
  fiscalPeriod: String!
  status: String!
  organizationId: String!
  createdBy: String!
  createdAt: String!
  updatedAt: String!
}

type ChartOfAccounts {
  id: ID!
  accountCode: String!
  accountNumber: String
  accountName: String!
  """asset | liability | equity | revenue | expense | bank | receivable | payable | other"""
  accountType: String!
  """ObjectId reference to parent ChartOfAccounts for tree structure."""
  parentAccountId: ID
  parentAccount: String
  level: Int!
  isActive: Boolean!
  organizationId: String!
  description: String
  createdAt: String!
  updatedAt: String!
}

input GeneralLedgerInput {
  transactionDate: String!
  transactionType: String!
  referenceModule: String!
  referenceId: String!
  debitAccount: String!
  creditAccount: String!
  amount: Float!
  currency: String
  description: String!
  fiscalYear: String!
  fiscalPeriod: String!
  organizationId: String!
}

input ChartOfAccountsInput {
  """accountCode is generated server-side based on accountType. Ignored if supplied."""
  accountCode: String
  """Optional human-entered identifier (e.g. legacy ledger number)."""
  accountNumber: String
  accountName: String!
  """asset | liability | equity | revenue | expense | bank | receivable | payable | other"""
  accountType: String!
  """ID of parent ChartOfAccounts document (for tree structure)."""
  parentAccountId: ID
  level: Int
  isActive: Boolean
  organizationId: String!
  description: String
}

type TrialBalanceLine {
  accountCode: String!
  accountName: String!
  accountType: String!
  debit: Float!
  credit: Float!
  net: Float!
}

type FinancialStatementLine {
  accountCode: String!
  accountName: String!
  amount: Float!
}

type IncomeStatementReport {
  revenueLines: [FinancialStatementLine!]!
  totalRevenue: Float!
  cogsLines: [FinancialStatementLine!]!
  totalCogs: Float!
  grossProfit: Float!
  expenseLines: [FinancialStatementLine!]!
  totalOperatingExpense: Float!
  netIncome: Float!
}

type BalanceSheetReport {
  assetLines: [FinancialStatementLine!]!
  totalAssets: Float!
  liabilityLines: [FinancialStatementLine!]!
  totalLiabilities: Float!
  equityLines: [FinancialStatementLine!]!
  totalEquity: Float!
  totalLiabilitiesAndEquity: Float!
  balanced: Boolean!
}

type AgedPayableBillLine {
  billId: ID!
  billNumber: String!
  billDate: String!
  dueDate: String!
  totalAmount: Float!
  outstandingAmount: Float!
  daysOverdue: Int!
  status: String!
}

type AgedPayableRow {
  vendorId: ID!
  vendorName: String!
  """Not yet due"""
  current: Float!
  """1–30 days overdue"""
  days30: Float!
  """31–60 days overdue"""
  days60: Float!
  """61–90 days overdue"""
  days90: Float!
  """Over 90 days overdue"""
  over90: Float!
  total: Float!
  bills: [AgedPayableBillLine!]!
}

type AgedReceivableInvoiceLine {
  invoiceId: ID!
  invoiceNumber: String!
  invoiceDate: String!
  dueDate: String!
  totalAmount: Float!
  outstandingAmount: Float!
  daysOverdue: Int!
  status: String!
}

type AgedReceivableRow {
  customerId: ID!
  customerName: String!
  current: Float!
  days30: Float!
  days60: Float!
  days90: Float!
  over90: Float!
  total: Float!
  invoices: [AgedReceivableInvoiceLine!]!
}

extend type Query {
  generalLedger(id: ID!): GeneralLedger
  generalLedgers(organizationId: String!, page: Int, limit: Int, fiscalYear: String, status: String): [GeneralLedger!]!
  chartOfAccount(id: ID!): ChartOfAccounts
  chartOfAccounts(organizationId: String!, page: Int, limit: Int, accountType: String): [ChartOfAccounts!]!
  trialBalance(organizationId: String!): [TrialBalanceLine!]!
  incomeStatement(organizationId: String!): IncomeStatementReport!
  balanceSheet(organizationId: String!): BalanceSheetReport!
  """Aged Payable report — outstanding vendor bills bucketed by days overdue (0 / 1-30 / 31-60 / 61-90 / 90+)."""
  agedPayable(organizationId: String!): [AgedPayableRow!]!
  """Aged Receivable report — outstanding customer invoices bucketed by days overdue."""
  agedReceivable(organizationId: String!): [AgedReceivableRow!]!
}

extend type Mutation {
  createGeneralLedger(input: GeneralLedgerInput!): GeneralLedger!
  createChartOfAccount(input: ChartOfAccountsInput!): ChartOfAccounts!
  updateChartOfAccount(id: ID!, input: ChartOfAccountsInput!): ChartOfAccounts!
  deleteChartOfAccount(id: ID!): Boolean!
}
