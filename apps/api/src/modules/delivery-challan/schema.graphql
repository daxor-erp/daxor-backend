type DeliveryChallanLine {
  itemName: String!
  quantity: Float!
  unit: String
  notes: String
}

type DeliveryChallan {
  id: ID!
  docNumber: String!
  docDate: String!
  customerId: String
  customerName: String
  salesOrderId: String
  salesOrderNumber: String
  shippingAddress: String
  vehicleNumber: String
  driverName: String
  notes: String
  items: [DeliveryChallanLine!]!
  status: String!
  organizationId: String!
  createdAt: String!
}

input DeliveryChallanLineInput {
  itemName: String!
  quantity: Float!
  unit: String
  notes: String
}

input DeliveryChallanInput {
  docDate: String!
  customerId: String
  customerName: String
  salesOrderId: String
  salesOrderNumber: String
  shippingAddress: String
  vehicleNumber: String
  driverName: String
  notes: String
  items: [DeliveryChallanLineInput!]
  status: String
  organizationId: String!
}

extend type Query {
  deliverychallan(id: ID!): DeliveryChallan
  deliverychallans(organizationId: String!, page: Int, limit: Int): [DeliveryChallan!]!
}

extend type Mutation {
  createDeliveryChallan(input: DeliveryChallanInput!): DeliveryChallan!
  updateDeliveryChallan(id: ID!, input: DeliveryChallanInput!): DeliveryChallan!
  submitDeliveryChallanForApproval(id: ID!): DeliveryChallan!
  deleteDeliveryChallan(id: ID!): Boolean!
}
