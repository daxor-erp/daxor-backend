type GRNLineItem {
  itemDescription: String!
  orderedQty: Float!
  receivedQty: Float!
  unitPrice: Float
  """Combined lot/serial values stored on the receipt line."""
  lotSerialNumbers: [String!]!
  """Convenience: first lot value entered on the GRN form."""
  lotNumber: String
  """Convenience: first serial value entered on the GRN form."""
  serialNumber: String
}

type LotSerialTraceEvent {
  eventType: String!
  documentType: String!
  documentId: ID!
  documentNumber: String!
  date: String!
  itemDescription: String
  quantity: Float
  location: String
  referenceModule: String
}

type LotSerialTraceResult {
  lotOrSerial: String!
  events: [LotSerialTraceEvent!]!
  totalEventsFound: Int!
}

type GRN {
  id: ID!
  grnNumber: String!
  purchaseOrderId: ID
  vendorId: ID
  vendorName: String
  receivedDate: String!
  lineItems: [GRNLineItem!]!
  notes: String
  status: String!
  organizationId: ID!
  createdAt: String
}

input GRNLineItemInput {
  itemDescription: String!
  orderedQty: Float!
  receivedQty: Float!
  unitPrice: Float
  lotNumber: String
  serialNumber: String
  lotSerialNumbers: [String!]
}

input CreateGRNInput {
  purchaseOrderId: ID
  vendorId: ID
  vendorName: String
  receivedDate: String!
  lineItems: [GRNLineItemInput!]!
  notes: String
  organizationId: ID!
  """draft | submitted | approval_declined | confirmed (default draft)"""
  status: String
}

input UpdateGRNInput {
  status: String
  notes: String
  receivedDate: String
  vendorName: String
  lineItems: [GRNLineItemInput!]
}

extend type Query {
  grn(id: ID!): GRN
  grns(organizationId: ID!, page: Int, limit: Int): [GRN!]!
  grnsByPO(purchaseOrderId: ID!): [GRN!]!
  """
  Lot/Serial Traceability Report — forward and backward trace.
  Given a lot or serial number, returns every document where it appears:
  GRN receipts (where it entered), stock movements, and delivery orders (where it left).
  """
  lotSerialTrace(organizationId: ID!, lotOrSerial: String!): LotSerialTraceResult!
}

extend type Mutation {
  createGRN(input: CreateGRNInput!): GRN!
  updateGRN(id: ID!, input: UpdateGRNInput!): GRN!
  submitGRNForApproval(id: ID!): GRN!
  deleteGRN(id: ID!): Boolean!
}
