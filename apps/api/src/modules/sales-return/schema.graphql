type SalesReturnLine {
  itemName: String!
  quantity: Float!
  unit: String
  unitPrice: Float
  amount: Float
  notes: String
}

type SalesReturn {
  id: ID!
  docNumber: String!
  docDate: String!
  status: String!
  organizationId: String!
  customerInvoiceId: ID
  customerInvoiceNumber: String
  customerId: ID
  customerName: String
  salesOrderId: ID
  salesOrderNumber: String
  totalAmount: Float
  cogsAmount: Float
  reason: String
  notes: String
  items: [SalesReturnLine!]!
  createdAt: String!
}

input SalesReturnLineInput {
  itemName: String!
  quantity: Float!
  unit: String
  unitPrice: Float
  amount: Float
  notes: String
}

input SalesReturnInput {
  docDate: String!
  status: String
  organizationId: String!
  customerInvoiceId: ID
  customerInvoiceNumber: String
  customerId: ID
  customerName: String
  salesOrderId: ID
  salesOrderNumber: String
  totalAmount: Float
  cogsAmount: Float
  reason: String
  notes: String
  items: [SalesReturnLineInput!]
}

extend type Query {
  salesreturn(id: ID!): SalesReturn
  salesreturns(organizationId: String!, page: Int, limit: Int): [SalesReturn!]!
}

extend type Mutation {
  createSalesReturn(input: SalesReturnInput!): SalesReturn!
  updateSalesReturn(id: ID!, input: SalesReturnInput!): SalesReturn!
  submitSalesReturnForApproval(id: ID!): SalesReturn!
  deleteSalesReturn(id: ID!): Boolean!
}
